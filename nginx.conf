server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    location /api/ { proxy_pass http://backend:8000; }
    location = /health { proxy_pass http://backend:8000; }
    location /docs { proxy_pass http://backend:8000; }
    location = /openapi.json { proxy_pass http://backend:8000; }
    location / { try_files $uri $uri/ /index.html; }
}
