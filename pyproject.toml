[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "releaselens"
version = "0.1.0"
description = "Release-scoped evidence and documentation change intelligence"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.143.1", "uvicorn==0.54.0", "pydantic==2.13.5",
  "SQLAlchemy==2.1.4", "alembic==1.20.0", "pgvector==0.5.1",
  "psycopg[binary]==3.3.6", "httpx==0.28.1"
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.0"]
ml = ["sentence-transformers==6.1.0"]

[tool.setuptools.packages.find]
include = ["releaselens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "Depends"]

