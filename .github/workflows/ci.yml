name: ReleaseLens verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock
      - run: pip install --no-deps -e .
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q --junitxml=evaluation/ci-v3-tests.xml
      - run: python -m releaselens.evaluate
      - run: python -m releaselens.benchmark --output evaluation/pilot-hash-tuning.json
      - run: python scripts/evaluate_prose_impact.py
      - run: python -m scripts.supplement_v3 --output evaluation/ci-retrieval-supplement.json
      - run: node --check web/app.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-and-prose-evidence
          path: |
            evaluation/ci-v3-tests.xml
            evaluation/prose-impact-v3.json
            evaluation/ci-retrieval-supplement.json
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: releaselens
          POSTGRES_USER: releaselens
          POSTGRES_PASSWORD: ci-ephemeral-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U releaselens -d releaselens"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://releaselens:ci-ephemeral-password@localhost:5432/releaselens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock
      - run: python -m alembic upgrade head
      - run: python -m pytest tests/test_postgres.py -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/configure.py
      - run: python scripts/verify_docker.py
      - run: python scripts/verify_recovery.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-operational-evidence
          path: |
            evaluation/docker-verification.json
            evaluation/recovery-verification.json
      - run: docker compose down -v
        if: always()
