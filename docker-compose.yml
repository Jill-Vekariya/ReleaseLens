services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: releaselens
      POSTGRES_USER: releaselens
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run python scripts/configure.py}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U releaselens -d releaselens"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://releaselens:${DB_PASSWORD}@db:5432/releaselens
      RELEASELENS_TOKENS: ${RELEASELENS_TOKENS:?Run python scripts/configure.py}
      RELEASELENS_DEMO: "false"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  frontend:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata:
